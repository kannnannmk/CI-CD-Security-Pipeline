trigger:
  - main
  - develop

pr:
  - main
  - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildId: $(Build.BuildId)

stages:
  - stage: RetrieveSecrets
    displayName: '🔐 Retrieve Secrets from AWS Secrets Manager'
    jobs:
      - job: FetchSecrets
        steps:
          - bash: |
              apt-get update && apt-get install -y awscli
              SONAR_TOKEN=$(aws secretsmanager get-secret-value --secret-id security-audit-sonarqube-token --query SecretString --output text)
              DEPENDENCY_TRACK_KEY=$(aws secretsmanager get-secret-value --secret-id security-audit-dependencytrack-api-key --query SecretString --output text)
              SONAR_URL=$(aws secretsmanager get-secret-value --secret-id security-audit-sonarqube-url --query SecretString --output text)
              DEPTRACK_URL=$(aws secretsmanager get-secret-value --secret-id security-audit-dependencytrack-url --query SecretString --output text)
              echo "##vso[task.setvariable variable=SONAR_TOKEN;issecret=true]$SONAR_TOKEN"
              echo "##vso[task.setvariable variable=DEPENDENCY_TRACK_API_KEY;issecret=true]$DEPENDENCY_TRACK_KEY"
              echo "##vso[task.setvariable variable=SonarQubeUrl]$SONAR_URL"
              echo "##vso[task.setvariable variable=DependencyTrackUrl]$DEPTRACK_URL"
              echo "✓ Secrets retrieved from AWS Secrets Manager"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: us-east-1
            displayName: 'Fetch from Secrets Manager'

  - stage: DecryptKMS
    displayName: '🔑 Decrypt KMS Encrypted Secrets'
    dependsOn: RetrieveSecrets
    jobs:
      - job: DecryptSecrets
        steps:
          - bash: |
              ENCRYPTED_KEY=$(aws secretsmanager get-secret-value --secret-id security-audit-gitleaks-config --query SecretString --output text 2>/dev/null || echo "")
              if [ ! -z "$ENCRYPTED_KEY" ]; then
                DECRYPTED_KEY=$(echo $ENCRYPTED_KEY | base64 -d)
                echo "##vso[task.setvariable variable=GITLEAKS_CONFIG;issecret=true]$DECRYPTED_KEY"
              fi
              echo "✓ KMS decryption completed"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: us-east-1
            displayName: 'Decrypt KMS Secrets'
            continueOnError: true

  - stage: SecretScanning
    displayName: '🔒 Secret Scanning (GitLeaks)'
    dependsOn: DecryptKMS
    condition: succeeded()
    jobs:
      - job: GitLeaksJob
        steps:
          - checkout: self
            fetchDepth: 0

          - bash: |
              wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks-linux-x64 -O gitleaks
              chmod +x gitleaks
              ./gitleaks detect --source . --report-format json --report-path $(Build.ArtifactStagingDirectory)/gitleaks-report.json || true
            displayName: 'Run GitLeaks Scan'

          - bash: |
              SECRETS=$(jq 'length' $(Build.ArtifactStagingDirectory)/gitleaks-report.json 2>/dev/null || echo 0)
              echo "Secrets found: $SECRETS"
              if [ "$SECRETS" -gt 0 ]; then
                echo "##vso[task.logissue type=error]CRITICAL: Secrets detected in repository!"
                exit 1
              fi
            displayName: '🚨 Security Gate: No Secrets Allowed'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'gitleaks-report'
            condition: always()
            displayName: 'Publish GitLeaks Report'

  - stage: SonarQubeAnalysis
    displayName: '🔍 SAST Analysis (SonarQube)'
    dependsOn: SecretScanning
    condition: succeeded()
    jobs:
      - job: SonarJob
        steps:
          - checkout: self
            fetchDepth: 0

          - task: SonarQubePrepare@5
            inputs:
              SonarQube: 'SonarQubeConnection'
              scannerMode: 'CLI'
              configMode: 'manual'
              cliProjectKey: 'audit-$(buildId)'
              cliProjectName: 'Security Audit Pipeline'
              cliSources: '.'
              extraProperties: |
                sonar.host.url=$(SonarQubeUrl)
                sonar.login=$(SONAR_TOKEN)
                sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**
                sonar.sourceEncoding=UTF-8
            displayName: 'Prepare SonarQube Analysis'

          - task: SonarQubeAnalyze@5
            displayName: 'Run SonarQube Code Analysis'

          - task: SonarQubePublish@5
            inputs:
              pollingTimeoutSec: '300'
            displayName: 'Publish SonarQube Results'

          - bash: |
              GATE=$(curl -s -u $(SONAR_TOKEN): "$(SonarQubeUrl)/api/qualitygates/project_status?projectKey=audit-$(buildId)" | jq -r '.projectStatus.status')
              echo "Quality Gate Status: $GATE"
              if [ "$GATE" != "OK" ]; then
                echo "##vso[task.logissue type=error]SonarQube Quality Gate FAILED"
                exit 1
              fi
            displayName: '🚨 Security Gate: SonarQube Quality Gate Pass'

  - stage: DependencyAnalysis
    displayName: '📦 Dependency Analysis & SBOM'
    dependsOn: SonarQubeAnalysis
    condition: succeeded()
    jobs:
      - job: DepJob
        steps:
          - bash: |
              echo "Installing CycloneDX and Dependency-Check tools..."
              pip install cyclonedx-bom
              wget https://github.com/jeremylong/DependencyCheck_CLI/releases/download/v8.4.2/dependency-check-8.4.2-release.zip
              unzip dependency-check-8.4.2-release.zip
            displayName: 'Install Dependency Tools'

          - bash: |
              echo "Generating SBOM in CycloneDX format..."
              if [ -f pom.xml ]; then
                mvn org.cyclonedx:cyclonedx-maven-plugin:generateBom -DoutputFormat=json
                cp target/bom.json $(Build.ArtifactStagingDirectory)/sbom.json
                echo "✓ Java SBOM generated"
              elif [ -f package.json ]; then
                cyclonedx-npm --output-file $(Build.ArtifactStagingDirectory)/sbom.json
                echo "✓ Node.js SBOM generated"
              else
                echo "No package manager found"
              fi
            displayName: 'Generate SBOM'
            continueOnError: true

          - bash: |
              echo "Running OWASP Dependency-Check..."
              ./dependency-check/bin/dependency-check.sh --project "Security-Audit" --scan . --format JSON --out $(Build.ArtifactStagingDirectory)/dependency-check-report.json || true
            displayName: 'Run OWASP Dependency-Check'

          - bash: |
              if [ -f $(Build.ArtifactStagingDirectory)/sbom.json ]; then
                echo "Uploading SBOM to Dependency-Track..."
                curl -X POST "$(DependencyTrackUrl)/api/v1/bom" \
                  -H "Content-Type: application/json" \
                  -H "X-API-Key: $(DEPENDENCY_TRACK_API_KEY)" \
                  -d @$(Build.ArtifactStagingDirectory)/sbom.json 2>/dev/null || true
              fi
            displayName: 'Upload SBOM to Dependency-Track'
            continueOnError: true

          - bash: |
              echo "Checking for critical vulnerabilities..."
              CRITICAL=$(jq '[.reportSchema.vulnerabilities[] | select(.severity=="CRITICAL")] | length' $(Build.ArtifactStagingDirectory)/dependency-check-report.json 2>/dev/null || echo 0)
              HIGH=$(jq '[.reportSchema.vulnerabilities[] | select(.severity=="HIGH")] | length' $(Build.ArtifactStagingDirectory)/dependency-check-report.json 2>/dev/null || echo 0)
              echo "Critical vulnerabilities: $CRITICAL"
              echo "High vulnerabilities: $HIGH"
              if [ "$CRITICAL" -gt 0 ]; then
                echo "##vso[task.logissue type=error]CRITICAL vulnerabilities found in dependencies!"
                exit 1
              fi
            displayName: '🚨 Security Gate: No Critical Vulnerabilities'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'dependency-reports'
            condition: always()
            displayName: 'Publish Dependency Reports'

  - stage: IaCScanning
    displayName: '🏗️ Infrastructure as Code (Checkov)'
    dependsOn: DependencyAnalysis
    condition: succeeded()
    jobs:
      - job: IaCJob
        steps:
          - bash: |
              pip install checkov
            displayName: 'Install Checkov'

          - bash: |
              if [ -d terraform ]; then
                echo "Scanning Terraform files..."
                checkov -d terraform/ --framework terraform --output json > $(Build.ArtifactStagingDirectory)/checkov-terraform.json || true
              fi
            displayName: 'Scan Terraform'
            continueOnError: true

          - bash: |
              if [ -d cloudformation ]; then
                echo "Scanning CloudFormation templates..."
                checkov -d cloudformation/ --framework cloudformation --output json > $(Build.ArtifactStagingDirectory)/checkov-cloudformation.json || true
              fi
            displayName: 'Scan CloudFormation'
            continueOnError: true

          - bash: |
              FAILED=$(jq '.summary.failed' $(Build.ArtifactStagingDirectory)/checkov-terraform.json 2>/dev/null || echo 0)
              echo "Failed IaC compliance checks: $FAILED"
              if [ "$FAILED" -gt 10 ]; then
                echo "##vso[task.logissue type=error]Too many IaC compliance failures: $FAILED"
                exit 1
              fi
            displayName: '🚨 Security Gate: IaC Compliance'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'iac-reports'
            condition: always()
            displayName: 'Publish IaC Scan Reports'

  - stage: FinalApproval
    displayName: '✅ Security Audit Complete'
    dependsOn: IaCScanning
    condition: succeeded()
    jobs:
      - job: Summary
        steps:
          - bash: |
              echo "========================================"
              echo "🎯 SECURITY AUDIT PIPELINE COMPLETED"
              echo "========================================"
              echo "✓ Secret Scanning: PASSED"
              echo "✓ SAST Analysis: PASSED"
              echo "✓ Dependency Analysis: PASSED"
              echo "✓ IaC Compliance: PASSED"
              echo "========================================"
              echo "All security gates have been APPROVED!"
              echo "Pipeline build #$(Build.BuildNumber)"
              echo "========================================"
            displayName: 'Audit Summary & Approval'
